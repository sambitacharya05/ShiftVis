[project]
name = "shiftvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.121.3",
    "numpy>=2.3.5",
    "opencv-python>=4.11.0.86",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.12.0",
    "ruff>=0.14.5",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.2",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[project.scripts]
test = "pytest:main"
test-verbose = "pytest:main -v -s"
test-coverage = "pytest:main --cov=src --cov-report=term-missing"
test-segmentor = "pytest:main tests/test_segmentor.py -v"
