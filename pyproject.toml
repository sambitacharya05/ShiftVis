[project]
name = "shiftvis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3.4",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[project.scripts]
test = "pytest:main"
test-verbose = "pytest:main -v -s"
test-coverage = "pytest:main --cov=src --cov-report=term-missing"
test-segmentor = "pytest:main tests/test_segmentor.py -v"
